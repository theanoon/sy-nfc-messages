<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Suyenlim - Daily Chi</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #2c0707 0%, #000000 100%);
            color: #f4d03f; /* Gold text */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
        }
        .logo {
            width: 180px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.5));
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 30px;
            border: 1px solid rgba(244, 208, 63, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .day-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff4d4d; /* Red highlight */
            margin-bottom: 15px;
            display: block;
        }
        .quote {
            font-size: 1.6rem;
            line-height: 1.5;
            font-weight: 500;
            margin-bottom: 25px;
        }
        .attribution {
            font-size: 0.8rem;
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="SYLogo-MasterSuyenlim_Red.jpg" alt="Master Suyenlim Logo" class="logo">
        
        <div class="card">
            <span id="day-text" class="day-label">Discovering Wisdom...</span>
            <p id="quote-text" class="quote">Harnessing the Chi of the universe.</p>
            <div class="attribution">— Master Suyenlim</div>
        </div>
    </div>

    <script>
        const quotes = [
            { day: "Day 1", text: "Embrace the strength of your Day Pillar; today is the foundation for your future." },
            { day: "Day 2", text: "Let positive Chi flow through your space; clear clutter to welcome new opportunities." },
            { day: "Day 3", text: "Focus on the Wood element: Growth is not just possible, it is inevitable when you nurture it." },
            { day: "Day 4", text: "Balance your Yin and Yang. Strength is found in the harmony between action and rest." },
            { day: "Day 5", text: "Your Destiny (Bazi) is the map, but your Action is the vehicle. Drive with confidence today." },
            { day: "Day 6", text: "Radiate the Fire element. Let your passion light the path for yourself and others." },
            { day: "Day 7", text: "The Earth element grounds you. Stay centered and your ambitions will take firm root." },
            { day: "Day 8", text: "Metal element clarity: Use this energy to cut through indecision and focus on what matters." },
            { day: "Day 9", text: "Flow like Water. Be adaptable, and you will move around every obstacle with ease." },
            { day: "Day 10", text: "Your Wealth Star shines brightest when you provide value to the world. Give to receive." },
            { day: "Day 11", text: "When the Five Elements are in harmony within, external chaos cannot disturb your peace." },
            { day: "Day 12", text: "Every Bazi chart has a hidden gift. Today, look for the blessing disguised as a challenge." },
            { day: "Day 13", text: "Prosperity follows where positive energy settles. Smile, and let the Chi gather." },
            { day: "Day 14", text: "The I-Ching teaches that change is the only constant. Pivot today to find your advantage." },
            { day: "Day 15", text: "Your internal Feng Shui is the foundation. A calm heart creates a prosperous environment." },
            { day: "Day 16", text: "Nobleman stars are everywhere. Be a Nobleman to someone else today, and help will return to you." },
            { day: "Day 17", text: "Timing is everything. Sync your heart with the universe's rhythm to find effortless success." },
            { day: "Day 18", text: "A clear mind is the best compass. Use your inner Qimen strategy to navigate today's goals." },
            { day: "Day 19", text: "Cultivate your 'Shen' (Spirit). When your inner light is bright, no shadow can follow you." },
            { day: "Day 20", text: "Like the Dragon rising from the mist, let your confidence soar above small worries." },
            { day: "Day 21", text: "You are the master of your Heaven, Earth, and Man luck. Align them today for total victory." }
        ];

        function getDailyMessage() {
            // This picks a random day from the list of 21
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const selection = quotes[randomIndex];
            
            document.getElementById('day-text').innerText = selection.day;
            document.getElementById('quote-text').innerText = selection.text;
        }

        window.onload = getDailyMessage;
    </script>
</body>
</html>
