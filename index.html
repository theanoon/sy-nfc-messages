<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spark</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
        }
        h1 { font-size: 1.2rem; opacity: 0.7; margin-bottom: 20px; letter-spacing: 2px; }
        p { font-size: 1.8rem; line-height: 1.4; font-weight: 600; }
        .refresh { margin-top: 30px; font-size: 0.8rem; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MOMENT OF CLARITY</h1>
        <p id="message">Loading your message...</p>
        <div class="refresh">Tap again tomorrow for a new perspective.</div>
    </div>

    <script>
        const messages = [
            "Your energy today creates your future tomorrow.",
            "Wisdom is simply the reward for surviving your own mistakes.",
            "The universe isn't happening to you; it's happening for you.",
            "Confidence is a muscle. Flex it today.",
            "Peace is the highest form of self-help.",
            "Every sunset is an opportunity to reset.",
            "You have survived 100% of your hardest days so far."
        ];

        const displayMessage = () => {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById('message').innerText = messages[randomIndex];
        };

        window.onload = displayMessage;
    </script>
</body>
</html>
