<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Suyenlim - Daily Positive Alignment</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            color: white;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            max-width: 500px;
            animation: fadeIn 2s ease-in;
        }
        .logo {
            width: 180px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.3));
        }
        h2 {
            font-weight: 300;
            letter-spacing: 3px;
            color: #d4af37; /* Gold color */
            text-transform: uppercase;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .quote {
            font-size: 1.6rem;
            line-height: 1.5;
            font-style: italic;
            padding: 0 20px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="image_0.png" alt="Master Suyenlim Logo" class="logo">
        
        <h2 id="day-label">Loading...</h2>
        <p class="quote" id="quote-display"></p>
    </div>

    <script>
        // 21 DAY SEQUENCE QUOTES
        const sequenceQuotes = [
            "Your journey begins with a single intentional breath. Qi flows where your mind goes.",
            "Balance your inner Yin; peace is the foundation of all future success.",
            "The Wood element grows today. Be flexible like bamboo, yet rooted in your truth.",
            "Fire ignites within. Let your passion light the way for others today.",
            "Earth provides stability. Stand firm in your decisions; you are supported.",
            "Metal brings clarity. Cut away the clutter in your mind to see the path ahead.",
            "Water flows around obstacles. Do not fight the current; adapt and conquer.",
            "Your internal compass is aligning with the North Star of your destiny.",
            "Auspicious stars are gathering. Open your heart to receive unexpected gifts.",
            "Harmony in your space creates harmony in your soul. Clear one corner today.",
            "The dragon rises. Courage is not the absence of fear, but the mastery of it.",
            "Nurture your roots. Your ancestors' wisdom whispers in your intuition.",
            "Abundance is a frequency. Tune your heart to gratitude and watch it manifest.",
            "Stillness is power. In the silence between thoughts, the universe speaks.",
            "You are the Feng Shui of your own life. Arrange your thoughts for prosperity.",
            "The Phoenix transforms. Release what was to make room for what is becoming.",
            "Gentle Qi heals the deepest wounds. Be kind to yourself today.",
            "Strategic patience is a virtue. The right timing is more powerful than force.",
            "Your aura is your shield. Radiate light and the darkness will find no home.",
            "Wisdom is found in the middle path. Avoid extremes and find your center.",
            "Day 21: You are now aligned. The master within you has awakened."
        ];

        // 60 RANDOM POOL QUOTES (Master Suyenlim Style)
        const randomQuotes = [
            "Flow with the Dao, and the world moves with you.",
            "Your Bazi is a map, but you are the traveler. Choose the scenic route.",
            "A clear mind attracts the best Noblemen into your life.",
            "When the heart is calm, every direction is auspicious.",
            "Balance is not something you find, it's something you create.",
            "The stars do not compel, they only suggest. You are the architect.",
            "Qi is the breath of the universe. Breathe deep and thrive.",
            "Small changes in placement lead to big changes in destiny.",
            "Your smile is the best Feng Shui for any room you enter.",
            "Trust the timing of the universe; the peach blossom blooms when ready.",
            "Energy is contagious. Surround yourself with high-vibration souls.",
            "The mountain does not move for the wind; stay grounded.",
            "Sunlight is the best cleanser for a heavy heart.",
            "Let go of the 'clutter' of yesterday to welcome the 'gold' of tomorrow.",
            "Every challenge is a secret gateway to a hidden blessing.",
            "Prosperity begins with a thought of enough.",
            "The Qimen gates are open for those who dare to step through.",
            "Your potential is like an uncarved jade; refine it with daily habit.",
            "Kindness is the highest form of metaphysics.",
            "Today is a 'Success' day if you choose to see the progress you've made."
            // ... (You can add up to 60 here)
        ];

        function getDailyContent() {
            const now = new Date();
            const todayStr = now.toDateString(); // e.g. "Tue Mar 31 2026"
            
            let startDate = localStorage.getItem('suyen_start_date');
            let lastVisit = localStorage.getItem('suyen_last_visit');
            
            // First time ever using the tag
            if (!startDate) {
                startDate = todayStr;
                localStorage.setItem('suyen_start_date', startDate);
            }

            const start = new Date(startDate);
            const diffTime = Math.abs(now - start);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

            const dayLabel = document.getElementById('day-label');
            const quoteDisplay = document.getElementById('quote-display');

            // LOGIC: If user re-taps/refreshes on the SAME day
            if (lastVisit === todayStr) {
                dayLabel.innerText = "Your Daily Alignment is set";
                const randomIdx = Math.floor(Math.random() * randomQuotes.length);
                quoteDisplay.innerText = randomQuotes[randomIdx];
            } 
            // LOGIC: If it's a new day and within the 21-day sequence
            else if (diffDays <= 21) {
                dayLabel.innerText = "Day " + diffDays;
                quoteDisplay.innerText = sequenceQuotes[diffDays - 1];
                localStorage.setItem('suyen_last_visit', todayStr);
            } 
            // LOGIC: After 21 days
            else {
                dayLabel.innerText = "Daily Alignment";
                const randomIdx = Math.floor(Math.random() * randomQuotes.length);
                quoteDisplay.innerText = randomQuotes[randomIdx];
                localStorage.setItem('suyen_last_visit', todayStr);
            }
        }

        window.onload = getDailyContent;
    </script>
</body>
</html>
